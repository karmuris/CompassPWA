<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#111318">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Compass">
  <title>Compass Heading</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app-shell">
  <header class="topbar"><select id="aircraft" aria-label="Aircraft"></select></header>
  <section class="result-panel">
    <div class="compass-results">
      <div class="compass-result primary"><div class="label">REPEAT COMPASS</div><div id="repeatHeading" class="compass-value">---</div></div>
      <div class="compass-result"><div class="label">MAG. COMPASS</div><div id="magHeading" class="compass-value magnetic">---</div></div>
    </div>
    <div class="input-label">TRUE COURSE</div><div id="course" class="course">---</div>
  </section>
  <section class="keypad" aria-label="Numeronäppäimistö">
    <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
    <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
    <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
    <button data-action="back" class="secondary">⌫</button><button data-key="0">0</button><button data-action="clear" class="secondary">CLR</button>
  </section>
</main>
<script src="aircraft-data.js"></script><script src="app.js"></script>
  <div class="app-version" aria-label="App version">v5.2</div>
</body></html>
